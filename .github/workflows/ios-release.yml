name: iOS Release (Thakir → TestFlight)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "رقم الإصدار الظاهر في المتجر (مثل 1.0.0)"
        default: "1.0.0"
        required: true

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: thakir
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.msj.thakir
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::السر $v غير مضبوط في إعدادات المستودع"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::السر ASC_KEY_P8 غير مضبوط"; exit 1; fi

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography

      - name: Register bundle id (if needed)
        run: python3 scripts/ensure_bundle_id.py "$BUNDLE_ID" "Thakir"

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Thakir.xcodeproj \
            -scheme Thakir \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Thakir.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | grep -E "error:|warning: unre|ARCHIVE|Signing" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Thakir.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|Upload|EXPORT|Package" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" export.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            thakir/archive.log
            thakir/export.log
